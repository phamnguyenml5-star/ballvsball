function drawWheelCanvas(){
 const wc=$('wheelCanvas');
 if(!wc) return;
 const wctx=wc.getContext('2d');
 const cx=130, cy=130, rad=120;
 const count=wheelRewards.length;
 const arc=Math.PI*2/count;

 wctx.clearRect(0,0,260,260);

 wctx.save();
 wctx.translate(cx,cy);
 wctx.rotate(wheelAngle);

 for(let i=0;i<count;i++){
  const angle = i*arc;
  wctx.fillStyle=wheelRewards[i].color;
  wctx.beginPath();
  wctx.moveTo(0,0);
  wctx.arc(0,0,rad,angle,angle+arc);
  wctx.lineTo(0,0);
  wctx.fill();

  wctx.strokeStyle='#fff';
  wctx.lineWidth=2;
  wctx.stroke();

  // Text
  wctx.save();
  wctx.rotate(angle + arc/2);
  wctx.textAlign='right';
  wctx.fillStyle='#fff';
  wctx.font='bold 14px system-ui';
  wctx.fillText(wheelRewards[i].label, rad-12, 5);
  wctx.restore();
 }
 wctx.restore();

 // Center pin
 wctx.fillStyle='#ffd84a';
 wctx.beginPath();
 wctx.arc(cx,cy,22,0,Math.PI*2);
 wctx.fill();
 wctx.strokeStyle='#fff';
 wctx.lineWidth=3;
 wctx.stroke();

 wctx.fillStyle='#000';
 wctx.font='bold 12px system-ui';
 wctx.textAlign='center';
 wctx.textBaseline='middle';
 wctx.fillText('SPIN', cx, cy);

 // Pointer Arrow top
 wctx.fillStyle='#ff0000';
 wctx.beginPath();
 wctx.moveTo(cx-10, 5);
 wctx.lineTo(cx+10, 5);
 wctx.lineTo(cx, 25);
 wctx.closePath();
 wctx.fill();
 wctx.strokeStyle='#fff';
 wctx.lineWidth=2;
 wctx.stroke();
}

function spinWheel(){
 if(availableSpins<=0 || isSpinning) return;
 availableSpins--;
 isSpinning=true;
 save();

 const targetIndex = Math.floor(Math.random()*wheelRewards.length);
 const count = wheelRewards.length;
 const arc = Math.PI*2 / count;
 const extraRounds = 5 + Math.floor(Math.random()*3); // 5-7 spins
 
 // The pointer is at top (-90 deg or 3PI/2). Angle logic calculation:
 const targetAngle = (extraRounds * Math.PI*2) + (Math.PI*1.5 - (targetIndex * arc + arc/2));

 let start = null;
 function animWheel(time){
  if(!start) start = time;
  const progress = (time - start) / 3500; // 3.5s duration
  if(progress < 1){
   // Ease out cubic
   const easeOut = 1 - Math.pow(1 - progress, 3);
   wheelAngle = easeOut * targetAngle;
   drawWheelCanvas();
   requestAnimationFrame(animWheel);
  } else {
   wheelAngle = targetAngle % (Math.PI*2);
   drawWheelCanvas();
   isSpinning = false;
   const rw = wheelRewards[targetIndex];
   if(rw.type === 'coins') coins += rw.val;

   save();
   alert('🎉 Chúc mừng bạn đã quay trúng: ' + rw.label + '!');

  }
 }

}

function handleNetData(data){
 if(data.type==='setName'){
  remoteName=data.name;
 }
 else if(data.type==='choose'){
  if(isHost){
   clientPicked=T.find(x=>x.id===data.ballId)||T[0];
   checkStartOnlineRoundHost();
  } else {
   hostPicked=T.find(x=>x.id===data.ballId)||T[0];
  }
 }
 else if(data.type==='aim'){
  if(isHost && bot){
   bot.aim=data.aim;
  }
 }
 else if(data.type==='readyToLaunch'){
  if(isHost){
   clientReady=true;
   checkBothReadyToLaunch();
  }
 }
 else if(data.type==='initRound'){
  hostPicked=T.find(x=>x.id===data.hostBall);
  clientPicked=T.find(x=>x.id===data.clientBall);
  pick=isHost ? hostPicked : clientPicked;
  me=mk(isHost ? hostPicked : clientPicked, 0);
  bot=mk(isHost ? clientPicked : hostPicked, 1);
  me.aim=isHost ? data.hostAim : data.clientAim;
  bot.aim=isHost ? data.clientAim : data.hostAim;
  lives=data.lives;
  mode='aim';
  locked=false;
  aimT=10*60;
  ov.innerHTML='';
 }
 else if(data.type==='state'){
  syncNetState(data);
 }
}

function checkStartOnlineRoundHost(){
 if(hostPicked && clientPicked){
  me=mk(hostPicked,0);
  bot=mk(clientPicked,1);
  me.aim=Math.atan2(bot.y-me.y,bot.x-me.x);
  bot.aim=Math.atan2(me.y-bot.y,me.x-bot.x);
  
  conn.send({
   type:'initRound',
   hostBall:hostPicked.id,
   clientBall:clientPicked.id,
   hostAim:me.aim,
   clientAim:bot.aim,
   lives:lives
  });

  pick=hostPicked;
  mode='aim';
  locked=false;
  aimT=10*60;
  ov.innerHTML='';
  clientReady=false;
  hostReady=false;
 }
}

function checkBothReadyToLaunch(){

  launch();
  sendNetState();
 }
}

function serializeBall(o){
 if(!o) return null;
 return {
  id: o.t.id, x: o.x, y: o.y, vx: o.vx, vy: o.vy, hp: o.hp, max: o.max, aim: o.aim, dm: o.dm, lv: o.lv, pow: o.pow,
  cdp: o.cdp, a: o.a, ac: o.ac, axx: o.axx, axy: o.axy, mag: o.mag, rl: o.rl, sh: o.sh, ch: o.ch, web: o.web,
  dash: o.dash, nt: o.nt, devil: o.devil, sp: o.sp, pz: o.pz, frz: o.frz, lc: o.lc, la: o.la, tp: o.tp, ez: o.ez,
  fz: o.fz, ic: o.ic, inv: o.inv, bn: o.bn, ea: o.ea, k1: o.k1, k2: o.k2, k3: o.k3, rv: o.rv, r: o.r,
  els: o.els||[], sn: o.sn||[], segs: o.segs||[], tr: o.tr||[], kids: (o.kids||[]).map(serializeBall)
 };
}

function deserializeBall(target, data){
 if(!target || !data) return;
 Object.assign(target, data);
 if(data.kids){
  target.kids = data.kids.map(kd => {
   const tObj = T.find(x => x.id === kd.id) || target.t;
   const child = mk(tObj, target.side);
   Object.assign(child, kd);
   return child;
  });
 }
}

 if(!conn || !isHost || !me || !bot) return;

 });

function syncNetState(d){

 if(!me || !bot) return;

 deserializeBall(me, d.bot);

 lives=[d.lives[1], d.lives[0]];

 proj = (d.proj||[]).map(p=>({x:p.x, y:p.y, vx:p.vx, vy:p.vy, c:p.c, b:p.b, l:p.l, dmg:p.dmg, bn:p.bn, o:bot}));
 fx = (d.fx||[]).map(f=>({x:f.x, y:f.y, r:f.r, c:f.c, l:f.l}));

 mines = (d.mines||[]).map(m=>({x:m.x, y:m.y, l:m.l, o:bot}));
 fires = (d.fires||[]).map(f=>({x:f.x, y:f.y, l:f.l, o:bot}));
 holes = (d.holes||[]).map(h=>({x:h.x, y:h.y, l:h.l, o:bot}));
 booms = (d.booms||[]).map(b=>({x:b.x, y:b.y, a:b.a, ph:b.ph, d:b.d, t:b.t, cd:b.cd, dead:b.dead, o:bot}));
 webs = (d.webs||[]).map(w=>({x:w.x, y:w.y, l:w.l, o:bot}));
 bolts = (d.bolts||[]).map(b=>({x1:b.x1, y1:b.y1, x2:b.x2, y2:b.y2, c:b.c, s:b.s, l:b.l}));
 beams = (d.beams||[]).map(b=>({x:b.x, y:b.y, a:b.a, l:b.l}));
 parts = (d.parts||[]).map(p=>({x:p.x, y:p.y, vx:p.vx, vy:p.vy, l:p.l, c:p.c}));

 if(d.msg) msg = d.msg === 'ROUND WON' ? 'ROUND LOST' : 'ROUND WON';
}

function launch(){locked=true;mode='fight';[me,bot].forEach(o=>{if(o){const sp=10.5;o.vx=Math.cos(o.aim)*sp;o.vy=Math.sin(o.aim)*sp}})}
function hurt(o,a){

 if(o.t.id==='verity'&&o.lv<(o.devil?2:1)&&Math.random()<.2){o.lv++;o.dm+=.3;o.hp=Math.min(o.max+40,o.hp+8);for(let i=0;i<12;i++)parts.push({x:o.x,y:o.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:22,c:o.lv>=2?'#ff2a4a':'#ffe36b'})}}
function hd(o,s){return o.t.id==='verity'?[8,15,30][o.lv]:(6+s*.5)*o.dm*(o.pow>0?2:1)}
function heal(o,a){a*=.9;o.hp=Math.min(o.max,o.hp+a);texts.push({x:o.x+(Math.random()-.5)*20,y:o.y-R-10,t:42,s:'+'+Math.round(a),g:1});for(let i=0;i<8;i++)parts.push({x:o.x,y:o.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:20,c:'#ff4a6a'})}
function grp(i){const L=i?bot:me;return L ? [L,...(L.kids||[])].filter(b=>b&&b.hp>0) : []}
function nearest(o,f){f=f||o;const g0=grp(1-o.side),g1=g0.filter(q=>!(q.inv>0)),g=g1.length?g1:g0;let b=g[0]||(o.side?me:bot),m=1e9;g.forEach(q=>{const d=Math.hypot(q.x-f.x,q.y-f.y);if(d<m){m=d;b=q}});return b}
function shoot(o,e,sp,dmg,b,col){if(!e)return;const a=Math.atan2(e.y-o.y,e.x-o.x);proj.push({x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o,dmg:dmg*o.dm,b,l:150,c:col})}
function step(o){
 if(!o) return;
 const R=o.r||34,e=nearest(o),id=o.t.id;
 (o.tr=o.tr||[]).push({x:o.x,y:o.y});if(o.tr.length>12)o.tr.shift();

 if(o.nl>0)o.nl--;
 if(o.bn>0){o.bn--;if(o.bn%30===0)hurt(o,2)}
 if(o.lat){const t=o.lat;if(t&&t.hp>0&&o.lt>0){o.lt--;const gap=R+(t.r||34)-8;o.x=Math.max(AX+R,Math.min(AX+S-R,t.x-Math.cos(o.la2)*gap));o.y=Math.max(AY+R,Math.min(AY+S-R,t.y-Math.sin(o.la2)*gap));o.vx=t.vx;o.vy=t.vy;if(o.lt%40===0){hurt(t,3);heal(o,3)}return}else{o.lat=null;o.nl=90;o.dash=150;if(t){const a=Math.atan2(t.y-o.y,t.x-o.x);o.vx=-Math.cos(a)*9;o.vy=-Math.sin(a)*9}}}
 o.x+=o.vx;o.y+=o.vy;o.vx*=.9995;o.vy*=.9995;
 if(o.frz>0){o.frz--;o.vx*=.95;o.vy*=.95}
 if(o.pz>0){o.pz--;if(o.pz%20===0)hurt(o,2)}
 let sp=Math.hypot(o.vx,o.vy);if(sp<5.5&&sp>0&&!(o.frz>0)){o.vx*=5.5/sp;o.vy*=5.5/sp}
 const lo=AX+R+5,hi=AX+S-R-5;
 if(o.x<lo){o.x=lo;o.vx=Math.abs(o.vx)}if(o.x>hi){o.x=hi;o.vx=-Math.abs(o.vx)}

 if(o.cdp>0)o.cdp--;if(o.pow>0)o.pow--;
 if(id==='axe'&&e){o.a+=.3;if(o.ac>0)o.ac--;const ax=o.x+Math.cos(o.a)*(R+20),ay=o.y+Math.sin(o.a)*(R+20);o.axx=ax;o.axy=ay;if(!o.ac&&Math.hypot(ax-e.x,ay-e.y)<R+8){o.ac=18;hurt(e,9*o.dm)}}
 if(id==='mg'&&e){if(o.rl>0){o.rl--;if(!o.rl)o.mag=24}else{o.sh++;if(o.sh%4===0){shoot(o,e,13,1,0,'#ffe36b');if(--o.mag<=0)o.rl=100}}}
 if(id==='bow'&&e){o.ch++;if(o.ch>=80){o.ch=0;shoot(o,e,12,13,3,'#e8c9a0')}}
